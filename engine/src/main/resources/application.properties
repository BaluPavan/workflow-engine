spring.application.name=engine

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/workflow_db
spring.datasource.username=${DB_USERNAME:workflow}
spring.datasource.password=${DB_PASSWORD:workflow}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=workflow-engine
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Workflow
workflow.kafka.topic.task-assigned=workflow.task.assigned
workflow.kafka.topic.task-result=workflow.task.result
workflow.retry-delay-seconds=30
workflow.scheduler.fixed-delay-ms=10000
workflow.outbox.fixed-delay-ms=1000

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.info.env.enabled=true
info.app.name=Workflow Engine
info.app.description=Event-driven workflow orchestration engine
info.app.version=0.0.1-SNAPSHOT
